<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRATIFLIX TV - EDITAVEL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif}
header{padding:10px 4%;background:#000;position:fixed;width:100%;top:0;z-index:100}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.logo{color:#e50914;font-size:26px;font-weight:900}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.actions button{border:none;padding:7px 9px;border-radius:4px;font-weight:800;cursor:pointer;font-size:10px}
.btn-red{background:#e50914;color:#fff}.btn-blue{background:#00a8ff;color:#fff}.btn-green{background:#00c851;color:#fff}.btn-white{background:#fff;color:#000}.btn-gray{background:#333;color:#fff}.btn-yellow{background:#ffcc00;color:#000}
.search{margin-top:8px;display:flex;gap:6px}
.search input{flex:1;padding:11px;border-radius:6px;border:none;background:#1a1a1a;color:#fff}
.search button{padding:11px 14px;border-radius:6px;border:none;background:#ffcc00;font-weight:900}
.banner{margin-top:115px;height:35vh;background:linear-gradient(to top,#0a0a0a,transparent),url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80');background-size:cover;display:flex;align-items:flex-end;padding:4%}
.row-title{font-size:17px;margin:20px 0 8px 4%;display:flex;justify-content:space-between}
.row{display:flex;gap:10px;overflow-x:auto;padding:0 4% 10px}
.card{min-width:135px;height:200px;background:#222;border-radius:8px;overflow:hidden;position:relative;flex-shrink:0}
.card img{width:100%;height:70%;object-fit:cover}
.card .t{padding:5px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;align-items:center}
.card .edit{position:absolute;top:4px;left:4px;background:rgba(255,204,0,0.9);border:none;color:#000;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:12px}
.card .lixeira{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.8);border:none;color:#fff;padding:4px 6px;border-radius:4px;cursor:pointer}
#player{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none}
#player iframe,#player video{width:100%;height:100%;border:none}
#player.voltar{position:absolute;top:15px;left:15px;background:#e50914;color:#fff;border:none;padding:8px 14px;border-radius:4px;z-index:10000}
#modalAdd{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:10000;display:none;align-items:center;justify-content:center;padding:15px}
.modal-box{border:2px solid #ffcc00;border-radius:18px;background:#111;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.modal-box h2{text-align:center;color:#ffcc00;margin-bottom:12px;font-size:18px}
.modal-box label{color:#ffcc00;font-weight:800;font-size:12px;margin:8px 0 4px;display:block}
.modal-box select,.modal-box input[type=text]{width:100%;padding:11px;border-radius:10px;border:none;background:#222;color:#fff;margin-bottom:8px}
.file-box{background:#222;border-radius:10px;padding:8px;margin-bottom:8px}
#preview,#previewCapa{width:100%;max-height:140px;border-radius:8px;display:none;margin-top:6px;background:#000}
.btns{display:flex;gap:10px;margin-top:12px}
.btns button{flex:1;padding:13px;border:none;border-radius:10px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<header>
<div class="top">
<div class="logo">GRATIFLIX TV</div>
<div class="actions">
<button class="btn-red" onclick="abrirModal()">+ VIDEO CELULAR</button>
<button class="btn-green" onclick="abrirModalYT()">+ LINK YT</button>
<button class="btn-blue" onclick="adicionarGenero()">+ GÊNERO</button>
<button class="btn-white" onclick="voltar()">↩ VOLTAR</button>
<button class="btn-gray" onclick="compartilharApp()">↗ COMPARTILHAR</button>
<button class="btn-yellow" onclick="convidarMembros()">+ CONVIDAR</button>
</div>
</div>
<div class="search"><input id="busca" placeholder="🔍 Pesquisar..." oninput="filtrar()"><button onclick="filtrar()">🔍</button></div>
</header>

<div class="banner"><div><h2>Filmes Editáveis</h2><p style="font-size:12px;color:#ccc">Clique no ✏️ pra mudar o nome</p></div></div>
<div id="containerPastas"></div>

<div id="player">
<button class="voltar" onclick="fecharPlayer()">↩ VOLTAR</button>
<iframe id="frame" style="display:none" allowfullscreen allow="autoplay; encrypted-media"></iframe>
<video id="videoLocal" style="display:none" controls></video>
</div>

<div id="modalAdd">
<div class="modal-box">
<h2 id="tituloModal">+ ADD</h2>
<label>Pasta / Gênero:</label><select id="pastaDestino"></select>
<label>Nome (digite o que quiser):</label><input type="text" id="inputNome" placeholder="Digite o nome do filme aqui">
<div id="areaYT" style="display:none"><label>🔗 Link YouTube:</label><input type="text" id="inputLinkYT" placeholder="https://youtu.be/..."></div>
<div id="areaCelular"><label>📷 CAPA:</label><div class="file-box"><input type="file" id="inputCapa" accept="image/*"></div><img id="previewCapa"><label>🎬 VÍDEO:</label><div class="file-box"><input type="file" id="inputVideo" accept="video/*"></div><video id="preview" controls></video></div>
<div class="btns"><button style="background:#333;color:#fff" onclick="fecharModal()">Cancelar</button><button style="background:#ffcc00;color:#000" onclick="salvarPWA()">Salvar</button></div>
</div>
</div>
