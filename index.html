<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRATIFLIX TV - V71 FINAL CORRIGIDO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif}
header{padding:10px 4%;background:#000;position:fixed;width:100%;top:0;z-index:100}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.logo{color:#e50914;font-size:26px;font-weight:900}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.actions button{border:none;padding:7px 9px;border-radius:4px;font-weight:800;cursor:pointer;font-size:10px}
.btn-red{background:#e50914;color:#fff}.btn-blue{background:#00a8ff;color:#fff}.btn-green{background:#00c851;color:#fff}.btn-white{background:#fff;color:#000}.btn-gray{background:#333;color:#fff}.btn-yellow{background:#ffcc00;color:#000}
.search{margin-top:8px;display:flex;gap:6px}
.search input{flex:1;padding:11px;border-radius:6px;border:none;background:#1a1a1a;color:#fff}
.search button{padding:11px 14px;border-radius:6px;border:none;background:#ffcc00;font-weight:900}
.banner{margin-top:115px;height:40vh;background:linear-gradient(to top,#0a0a0a,transparent),url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80');background-size:cover;display:flex;align-items:flex-end;padding:4%}
.row-title{font-size:17px;margin:20px 0 8px 4%;display:flex;justify-content:space-between}
.row{display:flex;gap:10px;overflow-x:auto;padding:0 4% 10px}
.card{min-width:135px;height:200px;background:#222;border-radius:8px;overflow:hidden;position:relative;flex-shrink:0}
.card img{width:100%;height:78%;object-fit:cover}
.card.t{padding:5px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.lixeira{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.8);border:none;color:#fff;padding:4px 6px;border-radius:4px;cursor:pointer}
#player{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none}
#player iframe,#player video{width:100%;height:100%;border:none}
#player.voltar{position:absolute;top:15px;left:15px;background:#e50914;color:#fff;border:none;padding:8px 14px;border-radius:4px;z-index:10000}
#modalAdd{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:10000;display:none;align-items:center;justify-content:center;padding:15px}
.modal-box{border:2px solid #ffcc00;border-radius:18px;background:#111;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.modal-box h2{text-align:center;color:#ffcc00;margin-bottom:12px;font-size:18px}
.modal-box label{color:#ffcc00;font-weight:800;font-size:12px;margin:8px 0 4px;display:block}
.modal-box select,.modal-box input[type=text]{width:100%;padding:11px;border-radius:10px;border:none;background:#222;color:#fff;margin-bottom:8px}
.file-box{background:#222;border-radius:10px;padding:8px;margin-bottom:8px}
#preview,#previewCapa{width:100%;max-height:140px;border-radius:8px;display:none;margin-top:6px;background:#000}
.btns{display:flex;gap:10px;margin-top:12px}
.btns button{flex:1;padding:13px;border:none;border-radius:10px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<header>
<div class="top">
<div class="logo">GRATIFLIX TV</div>
<div class="actions">
<button class="btn-red" onclick="abrirModal()">+ VIDEO CELULAR</button>
<button class="btn-green" onclick="abrirModalYT()">+ LINK YT</button>
<button class="btn-blue" onclick="adicionarGenero()">+ GÊNERO</button>
<button class="btn-white" onclick="voltar()">↩ VOLTAR</button>
<button class="btn-gray" onclick="compartilharApp()">↗ COMPARTILHAR</button>
<button class="btn-yellow" onclick="convidarMembros()">+ CONVIDAR</button>
</div>
</div>
<div class="search"><input id="busca" placeholder="🔍 Pesquisar pasta, gênero, filme..." oninput="filtrar()"><button onclick="filtrar()">🔍</button></div>
</header>

<div class="banner"><div><h2>Filmes, Séries e Canais Ao Vivo</h2><p style="font-size:12px;color:#ccc">V71 FINAL - Links YouTube não somem mais</p></div></div>

<div id="containerPastas"></div>

<div id="player">
<button class="voltar" onclick="fecharPlayer()">↩ VOLTAR</button>
<iframe id="frame" style="display:none" allowfullscreen allow="autoplay; encrypted-media"></iframe>
<video id="videoLocal" style="display:none" controls></video>
</div>

<div id="modalAdd">
<div class="modal-box">
<h2 id="tituloModal">📱 + VIDEO CELULAR PWA</h2>
<label>Pasta destino / Gênero:</label>
<select id="pastaDestino"></select>
<label>Nome do filme:</label>
<input type="text" id="inputNome" placeholder="Ex: Velozes e Furiosos">
<div id="areaYT" style="display:none">
<label>🔗 Link YouTube (youtu.be, watch, shorts):</label>
<input type="text" id="inputLinkYT" placeholder="https://youtu.be/lpeIKPBsuLc?si=...">
</div>
<div id="areaCelular">
<label>📷 CAPA (galeria):</label>
<div class="file-box"><input type="file" id="inputCapa" accept="image/*"></div>
<img id="previewCapa">
<label>🎬 VÍDEO (até 150MB):</label>
<div class="file-box"><input type="file" id="inputVideo" accept="video/*"></div>
<video id="preview" controls></video>
</div>
<div class="btns">
<button style="background:#333;color:#fff" onclick="fecharModal()">Cancelar</button>
<button style="background:#ffcc00;color:#000" onclick="salvarPWA()">Salvar PWA</button>
</div>
</div>
</div>

<script>
let GENEROS_PADRAO = ["Ação","Comédia","Ficção","Terror","Animação","Drama","Romance","Aventura","Geral"];
let GENEROS = [...GENEROS_PADRAO];
let filmesBase=[
{t:"Ação Total",i:"https://images.unsplash.com/photo-1485846234645-a62644f84728?w=300",l:"https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ",pasta:"Ação",type:"yt"},
{t:"Comédia Top",i:"https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?w=300",l:"https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ",pasta:"Comédia",type:"yt"},
{t:"Ficção Científica",i:"https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=300",l:"https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ",pasta:"Ficção",type:"yt"},
{t:"SEU VIDEO YOUTUBE",i:"https://img.youtube.com/vi/lpeIKPBsuLc/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/lpeIKPBsuLc",pasta:"Ação",type:"yt"}
];
let videoTemp=null, capaTemp=null, modoYT=false;

function converteYoutube(url){
 if(!url) return "";
 url=url.trim();
 if(url.includes("youtube-nocookie.com/embed")) return url;
 if(url.includes("youtube.com/embed")) return url.replace("youtube.com/embed","www.youtube-nocookie.com/embed");
 let id="";
 if(url.includes("youtu.be/")){
   id=url.split("youtu.be/")[1].split("?")[0].split("&")[0];
 } else if(url.includes("watch?v=")){
   id=url.split("watch?v=")[1].split("&")[0].split("?")[0];
 } else if(url.includes("shorts/")){
   id=url.split("shorts/")[1].split("?")[0].split("&")[0];
 } else if(url.length===11){
   id=url;
 } else {
   return url;
 }
 return "https://www.youtube-nocookie.com/embed/"+id;
}

document.getElementById('inputVideo').addEventListener('change',e=>{
 let f=e.target.files[0]; if(!f)return;
 if(f.size>150*1024*1024){alert('Muito grande! Max 150MB');return;}
 videoTemp=URL.createObjectURL(f);
 let p=document.getElementById('preview'); p.src=videoTemp; p.style.display='block';
});
document.getElementById('inputCapa').addEventListener('change',e=>{
 let f=e.target.files[0]; if(!f)return;
 capaTemp=URL.createObjectURL(f);
 let i=document.getElementById('previewCapa'); i.src=capaTemp; i.style.display='block';
});

function getGeneros(){
 let custom=JSON.parse(localStorage.getItem('grati_generos')||'[]');
 return [...new Set([...GENEROS_PADRAO,...custom])];
}
function salvarGeneros(){
 let gens=getGeneros();
 GENEROS=gens;
 document.getElementById('pastaDestino').innerHTML=gens.map(g=>`<option>${g}</option>`).join('');
 renderPorGenero(document.getElementById('busca').value);
}
function adicionarGenero(){
 let nome=prompt('Nome do novo gênero? Ex: Suspense, Infantil');
 if(!nome)return;
 nome=nome.trim();
 if(nome.length<2)return;
 let custom=JSON.parse(localStorage.getItem('grati_generos')||'[]');
 if(getGeneros().map(x=>x.toLowerCase()).includes(nome.toLowerCase())){alert('Já existe!');return;}
 custom.push(nome);
 localStorage.setItem('grati_generos',JSON.stringify(custom));
 salvarGeneros();
 alert('Gênero "'+nome+'" adicionado!');
}
function getTodos(){ let salvos=JSON.parse(localStorage.getItem('grati_lista')||'[]'); return [...filmesBase,...salvos]; }
function renderPorGenero(filtro){
 let cont=document.getElementById('containerPastas'); cont.innerHTML='';
 let todos=getTodos();
 if(filtro){ todos=todos.filter(f=>(f.t+f.pasta).toLowerCase().includes(filtro.toLowerCase())); }
 let gens=getGeneros();
 gens.forEach(gen=>{
  let filmesGen=todos.filter(f=>f.pasta===gen);
  if(filmesGen.length===0)return;
  let html=`<div class="row-title"><span>${gen} (${filmesGen.length})</span><button class="btn-gray" style="font-size:10px" onclick="limparGenero('${gen}')">🗑 LIMPAR</button></div><div class="row">`;
  filmesGen.forEach(f=>{
   let safeT=f.t.replace(/'/g,"");
   html+=`<div class="card"><button class="lixeira" onclick="deletarFilme('${gen}','${safeT}')">🗑</button><img src="${f.i}" onclick="abrirPlayer('${f.l}',${f.type==='local'})"><div class="t">${f.t}</div></div>`;
  });
  html+=`</div>`;
  cont.innerHTML+=html;
 });
 if(cont.innerHTML==='') cont.innerHTML='<div style="padding:30px;text-align:center;color:#777">Nenhum filme. Clique em + LINK YT ou + VIDEO CELULAR</div>';
}
function abrirPlayer(link,isLocal){
 if(isLocal){document.getElementById('frame').style.display='none';let v=document.getElementById('videoLocal');v.style.display='block';v.src=link;v.play();}
 else{document.getElementById('videoLocal').style.display='none';let fr=document.getElementById('frame');fr.style.display='block';fr.src=link;}
 document.getElementById('player').style.display='block';
}
function fecharPlayer(){document.getElementById('player').style.display='none';document.getElementById('frame').src='';document.getElementById('videoLocal').pause();}
function voltar(){if(document.getElementById('player').style.display==='block')fecharPlayer();else history.back();}
function abrirModal(){modoYT=false;document.getElementById('tituloModal').innerText='📱 + VIDEO CELULAR PWA';document.getElementById('areaYT').style.display='none';document.getElementById('areaCelular').style.display='block';document.getElementById('modalAdd').style.display='flex';}
function abrirModalYT(){modoYT=true;document.getElementById('tituloModal').innerText='🔗 + LINK YOUTUBE';document.getElementById('areaYT').style.display='block';document.getElementById('areaCelular').style.display='none';document.getElementById('inputLinkYT').value='https://youtu.be/lpeIKPBsuLc?si=SYYWbwa8ObrwZ98L';document.getElementById('modalAdd').style.display='flex';}
function fecharModal(){document.getElementById('modalAdd').style.display='none';}

function salvarPWA(){
 let nome=document.getElementById('inputNome').value||'Meu Filme';
 let pasta=document.getElementById('pastaDestino').value;
 let lista=JSON.parse(localStorage.getItem('grati_lista')||'[]');

 if(modoYT || document.getElementById('inputLinkYT').value){
   let linkRaw=document.getElementById('inputLinkYT').value;
   if(!linkRaw){alert('Cole o link do YouTube!');return;}
   let linkFinal=converteYoutube(linkRaw);
   let idVideo=linkFinal.split('/embed/')[1]||'';
   let capaYT=idVideo? 'https://img.youtube.com/vi/'+idVideo+'/hqdefault.jpg' : (capaTemp||'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=300');
   lista.push({t:nome,i:capaYT,l:linkFinal,pasta:pasta,type:'yt'});
   localStorage.setItem('grati_lista',JSON.stringify(lista));
   fecharModal(); salvarGeneros();
   document.getElementById('inputLinkYT').value='';
   document.getElementById('inputNome').value='';
   alert('Link YouTube salvo pra sempre em: '+pasta+' (não some mais!)');
   return;
 }

 if(!videoTemp){alert('Escolha o vídeo da galeria!');return;}
 lista.push({t:nome,i:capaTemp||'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=300',l:videoTemp,pasta:pasta,type:'local'});
 localStorage.setItem('grati_lista',JSON.stringify(lista));
 fecharModal(); salvarGeneros();
 videoTemp=null; capaTemp=null;
 document.getElementById('preview').style.display='none';
 document.getElementById('previewCapa').style.display='none';
 document.getElementById('inputNome').value='';
 alert('Vídeo do celular salvo em: '+pasta);
}

function deletarFilme(gen,nome){ if(!confirm('Apagar "'+nome+'" de '+gen+'?'))return; let l=JSON.parse(localStorage.getItem('grati_lista')||'[]'); let antes=l.length; l=l.filter(f=>!(f.t===nome && f.pasta===gen)); if(l.length!==antes){localStorage.setItem('grati_lista',JSON.stringify(l));} else {filmesBase=filmesBase.filter(f=>!(f.t===nome && f.pasta===gen));} salvarGeneros(); }
function limparGenero(gen){ if(!confirm('Limpar TUDO da pasta '+gen+'?'))return; let l=JSON.parse(localStorage.getItem('grati_lista')||'[]').filter(f=>f.pasta!==gen); localStorage.setItem('grati_lista',JSON.stringify(l)); filmesBase=filmesBase.filter(f=>f.pasta!==gen); salvarGeneros(); }
function filtrar(){ renderPorGenero(document.getElementById('busca').value); }
function compartilharApp(){ if(navigator.share)navigator.share({title:'GRATIFLIX TV',url:location.href}); else prompt('Copie:',location.href); }
function convidarMembros(){ let m='Entra no meu Gratiflix TV: '+location.href; if(navigator.share)navigator.share({text:m}); else prompt('Convite:',m); }
salvarGeneros();
</script>
</body>
</html>
