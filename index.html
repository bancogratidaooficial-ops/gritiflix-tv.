<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRATIFLIX TV - V71 PWA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif}
header{padding:10px 4%;background:#000;position:fixed;width:100%;top:0;z-index:100}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.logo{color:#e50914;font-size:26px;font-weight:900}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions button{border:none;padding:7px 10px;border-radius:4px;font-weight:700;cursor:pointer;font-size:11px}
.btn-red{background:#e50914;color:#fff}.btn-white{background:#fff;color:#000}.btn-gray{background:#333;color:#fff}.btn-yellow{background:#ffcc00;color:#000}
.search{margin-top:8px;display:flex;gap:6px}
.search input{flex:1;padding:10px;border-radius:6px;border:none;background:#1a1a1a;color:#fff}
.search button{padding:10px 14px;border-radius:6px;border:none;background:#ffcc00;font-weight:800}
.banner{margin-top:108px;height:55vh;background:linear-gradient(to top,#0a0a0a,transparent),url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80');background-size:cover;display:flex;align-items:flex-end;padding:4%}
.row-title{font-size:18px;margin:20px 0 10px 4%;display:flex;justify-content:space-between}
.row{display:flex;gap:10px;overflow-x:auto;padding:0 4% 10px}
.card{min-width:140px;height:210px;background:#222;border-radius:8px;overflow:hidden;position:relative;flex-shrink:0}
.card img{width:100%;height:80%;object-fit:cover}
.card.t{padding:5px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.lixeira{position:absolute;top:5px;right:5px;background:rgba(0,0,0,0.7);border:none;color:#fff;padding:4px 6px;border-radius:4px;cursor:pointer}
#player{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none}
#player iframe,#player video{width:100%;height:100%;border:none}
#player.voltar{position:absolute;top:15px;left:15px;background:#e50914;color:#fff;border:none;padding:8px 14px;border-radius:4px;z-index:10000}
#player.share{position:absolute;top:15px;right:15px;background:#fff;color:#000;border:none;padding:8px 14px;border-radius:4px;z-index:10000}

/* MODAL AMARELO IGUAL DA FOTO */
#modalAdd{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:10000;display:none;align-items:center;justify-content:center;padding:15px}
.modal-box{border:2px solid #ffcc00;border-radius:18px;background:#111;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.modal-box h2{text-align:center;color:#ffcc00;margin-bottom:12px;font-size:18px}
.modal-box label{color:#ffcc00;font-weight:800;font-size:13px;margin:10px 0 5px;display:block}
.modal-box select,.modal-box input[type=text]{width:100%;padding:12px;border-radius:10px;border:none;background:#222;color:#fff;margin-bottom:10px}
.file-box{background:#222;border-radius:10px;padding:10px;margin-bottom:10px}
.file-box input{color:#fff}
#preview{width:100%;max-height:180px;background:#000;border-radius:8px;margin:8px 0;display:none}
.info-file{color:#00ff88;font-size:12px;margin:5px 0}
.btns{display:flex;gap:10px;margin-top:12px}
.btns button{flex:1;padding:14px;border:none;border-radius:10px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<header>
<div class="top">
<div class="logo">GRATIFLIX TV</div>
<div class="actions">
<button class="btn-red" onclick="abrirModal()">+ VIDEO CELULAR</button>
<button class="btn-white" onclick="voltar()">↩ VOLTAR</button>
<button class="btn-gray" onclick="compartilharApp()">↗ COMPARTILHAR</button>
<button class="btn-yellow" onclick="convidarMembros()">+ CONVIDAR</button>
</div>
</div>
<div class="search">
<input id="busca" placeholder="🔍 Pesquisar pasta..." oninput="filtrar()">
<button onclick="filtrar()">🔍</button>
</div>
</header>

<div class="banner">
<div>
<h2>Filmes, Séries e Canais Ao Vivo</h2>
<p style="font-size:13px;color:#ddd;margin:8px 0">Experiência tipo Netflix PWA V71</p>
<button style="background:#fff;color:#000;padding:8px 16px;border:none;border-radius:4px;font-weight:800" onclick="abrirPlayer('https://www.youtube.com/embed/dQw4w9WgXcQ',false)">▶ Assistir</button>
</div>
</div>

<div class="row-title"><span>🔥 Em Alta Agora</span></div>
<div class="row" id="lista1"></div>
<div class="row-title"><span>🎬 Filmes</span><button class="btn-gray" style="font-size:10px" onclick="limparPasta('filmes')">🗑 LIMPAR</button></div>
<div class="row" id="lista2"></div>
<div class="row-title"><span>📺 Minha Lista</span><button class="btn-gray" style="font-size:10px" onclick="limparPasta('minha')">🗑 LIMPAR</button></div>
<div class="row" id="minha"></div>

<div id="player">
<button class="voltar" onclick="fecharPlayer()">↩ VOLTAR</button>
<button class="share" onclick="compartilharVideo()">↗ COMPARTILHAR</button>
<iframe id="frame" style="display:none" allowfullscreen></iframe>
<video id="videoLocal" style="display:none" controls></video>
</div>

<div id="modalAdd">
<div class="modal-box">
<h2>📱 + VIDEO CELULAR PWA</h2>
<label>Pasta destino:</label>
<select id="pastaDestino"><option>Geral</option><option>Filmes</option><option>Séries</option><option>Canais</option></select>
<label>Nome do filme</label>
<input type="text" id="inputNome" placeholder="Nome do filme">
<label>📷 CAPA (galeria):</label>
<div class="file-box"><input type="file" id="inputCapa" accept="image/*"></div>
<img id="previewCapa" style="width:100%;max-height:120px;object-fit:cover;border-radius:8px;display:none">
<label>🎬 VÍDEO (até 150MB, comprime auto):</label>
<div class="file-box"><input type="file" id="inputVideo" accept="video/*"></div>
<video id="preview" controls></video>
<div id="infoFile" class="info-file"></div>
<div class="btns">
<button style="background:#333;color:#fff" onclick="fecharModal()">Cancelar</button>
<button style="background:#ffcc00;color:#000" onclick="salvarPWA()">Salvar PWA</button>
</div>
</div>
</div>

<script>
var filmesBase=[
{t:"Ação Total",i:"https://images.unsplash.com/photo-1485846234645-a62644f84728?w=300",l:"https://www.youtube.com/embed/dQw4w9WgXcQ",pasta:"Geral",type:"yt"},
{t:"Aventura 2024",i:"https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=300",l:"https://www.youtube.com/embed/dQw4w9WgXcQ",pasta:"Geral",type:"yt"},
{t:"Drama Intenso",i:"https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=300",l:"https://www.youtube.com/embed/dQw4w9WgXcQ",pasta:"Filmes",type:"yt"},
{t:"Comédia Top",i:"https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?w=300",l:"https://www.youtube.com/embed/dQw4w9WgXcQ",pasta:"Filmes",type:"yt"}
];
var videoTemp=null, capaTemp=null;
document.getElementById('inputVideo').addEventListener('change',function(e){
 var file=e.target.files[0]; if(!file)return;
 if(file.size>150*1024*1024){alert('Muito grande! Máx 150MB');return;}
 var url=URL.createObjectURL(file);
 videoTemp=url;
 var prev=document.getElementById('preview');
 prev.src=url; prev.style.display='block';
 document.getElementById('infoFile').innerText=file.name+" "+(file.size/1024/1024).toFixed(1)+"MB - vai comprimir e salvar como APP";
});
document.getElementById('inputCapa').addEventListener('change',function(e){
 var file=e.target.files[0]; if(!file)return;
 capaTemp=URL.createObjectURL(file);
 var img=document.getElementById('previewCapa');
 img.src=capaTemp; img.style.display='block';
});
function card(f,idx){
 return '<div class="card"><button class="lixeira" onclick="deletar('+idx+')">🗑</button><img src="'+f.i+'" onclick="abrirPlayer(\''+f.l+'\','+(f.type==='local')+')"><div class="t" onclick="abrirPlayer(\''+f.l+'\','+(f.type==='local')+')">'+f.t+'</div></div>';
}
function renderTudo(listaFiltrada){
 var lista=listaFiltrada||filmesBase;
 document.getElementById('lista1').innerHTML=lista.map((f,i)=>card(f,i)).join('');
 document.getElementById('lista2').innerHTML=lista.filter(f=>f.pasta==='Filmes').map((f,i)=>card(f,i)).join('');
}
renderTudo();
function abrirPlayer(link,isLocal){
 if(isLocal){
   document.getElementById('frame').style.display='none';
   var v=document.getElementById('videoLocal'); v.style.display='block'; v.src=link; v.play();
 } else {
   document.getElementById('videoLocal').style.display='none';
   document.getElementById('frame').style.display='block';
   document.getElementById('frame').src=link;
 }
 document.getElementById('player').style.display='block';
 window.lastLink=link;
}
function fecharPlayer(){document.getElementById('player').style.display='none';document.getElementById('frame').src='';document.getElementById('videoLocal').pause();}
function voltar(){if(document.getElementById('player').style.display==='block'){fecharPlayer();} else {history.back();}}
function compartilharApp(){ if(navigator.share){navigator.share({title:'GRATIFLIX TV',url:location.href});} else {prompt('Copie o link:',location.href);} }
function compartilharVideo(){ if(navigator.share){navigator.share({title:'Assista esse filme',url:window.lastLink||location.href});} else {prompt('Copie:',window.lastLink);} }
function convidarMembros(){ var msg='Entra no meu Gratiflix TV: '+location.href; if(navigator.share){navigator.share({text:msg});} else {prompt('Link para convidar:',msg);} }
function abrirModal(){document.getElementById('modalAdd').style.display='flex';}
function fecharModal(){document.getElementById('modalAdd').style.display='none';}
function salvarPWA(){
 var nome=document.getElementById('inputNome').value||'Meu Filme';
 var pasta=document.getElementById('pastaDestino').value;
 if(!videoTemp){alert('Escolha o vídeo!');return;}
 var lista=JSON.parse(localStorage.getItem('grati_lista')||'[]');
 lista.push({t:nome,i:capaTemp||'https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?w=300',l:videoTemp,pasta:pasta,type:'local'});
 localStorage.setItem('grati_lista',JSON.stringify(lista));
 mostraMinha(); fecharModal(); alert('Salvo como PWA!');
 videoTemp=null; capaTemp=null;
 document.getElementById('preview').style.display='none';
 document.getElementById('previewCapa').style.display='none';
 document.getElementById('inputNome').value='';
 document.getElementById('infoFile').innerText='';
}
function mostraMinha(){
 var lista=JSON.parse(localStorage.getItem('grati_lista')||'[]');
 if(lista.length===0){document.getElementById('minha').innerHTML='<div style=color:#777;padding:10px>Clique em + VIDEO CELULAR</div>';return;}
 document.getElementById('minha').innerHTML=lista.map((f,i)=>'<div class="card"><button class="lixeira" onclick="deletarMinha('+i+')">🗑</button><img src="'+f.i+'" onclick="abrirPlayer(\''+f.l+'\',true)"><div class="t" onclick="abrirPlayer(\''+f.l+'\',true)">'+f.t+'</div></div>').join('');
}
mostraMinha();
function deletar(idx){ if(confirm('Apagar esse filme?')){filmesBase.splice(idx,1);renderTudo();} }
function deletarMinha(idx){ if(confirm('Apagar da Minha Lista?')){var l=JSON.parse(localStorage.getItem('grati_lista')||'[]');l.splice(idx,1);localStorage.setItem('grati_lista',JSON.stringify(l));mostraMinha();} }
function limparPasta(pasta){ if(confirm('Limpar pasta '+pasta+'?')){if(pasta==='minha'){localStorage.removeItem('grati_lista');mostraMinha();}else{filmesBase=filmesBase.filter(f=>f.pasta!==pasta);renderTudo();}} }
function filtrar(){
 var termo=document.getElementById('busca').value.toLowerCase();
 if(!termo){renderTudo();mostraMinha();return;}
 var f=filmesBase.filter(x=>x.t.toLowerCase().includes(termo)||x.pasta.toLowerCase().includes(termo));
 renderTudo(f);
 var m=JSON.parse(localStorage.getItem('grati_lista')||'[]').filter(x=>x.t.toLowerCase().includes(termo));
 if(m.length>0)document.getElementById('minha').innerHTML=m.map((f,i)=>card(f,i)).join('');
}
</script>
</body>
</html>
