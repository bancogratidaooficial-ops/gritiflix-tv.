let filmes=filmesBase;let generos=GENEROS_PADRAO;
function render(){let c=document.getElementById('containerPastas');c.innerHTML='';generos.forEach(g=>{let lista=filmes.filter(f=>f.pasta===g);if(lista.length===0)return;let h=`<div class="row-title">${g} (${lista.length})</div><div class="row">`;lista.forEach(f=>{let i=filmes.indexOf(f);h+=`<div class="card"><button class="edit" onclick="editar(${i})">✏️</button><button class="del" onclick="deletar(${i})">🗑️</button><img src="${f.i}" onclick="play(${i})"><div style="padding:6px;font-size:11px">${f.t}</div></div>`});h+=`</div>`;c.innerHTML+=h;});}
function play(i){document.getElementById('player').style.display='block';document.getElementById('frame').src=filmes[i].l;}
function fecharPlayer(){document.getElementById('player').style.display='none';document.getElementById('frame').src='';}
function filtrar(){let q=document.getElementById('busca').value.toLowerCase();if(!q){render();return}let c=document.getElementById('containerPastas');let l=filmes.filter(f=>f.t.toLowerCase().includes(q));let h=`<div class="row-title">Resultado (${l.length})</div><div class="row">`;l.forEach(f=>{let i=filmes.indexOf(f);h+=`<div class="card"><img src="${f.i}" onclick="play(${i})"><div style="padding:6px;font-size:11px">${f.t}</div></div>`});c.innerHTML=h+`</div>`;}
function abrirModalYT(){document.getElementById('modalAdd').style.display='flex';atualizarSelect()}
function fecharModal(){document.getElementById('modalAdd').style.display='none';}
function atualizarSelect(){let s=document.getElementById('pastaDestino');s.innerHTML='';generos.forEach(g=>s.innerHTML+=`<option>${g}</option>`);}
function salvarFilme(){let n=document.getElementById('inputNome').value||'Sem nome';let p=document.getElementById('pastaDestino').value;let l=document.getElementById('inputLinkYT').value;let id=l.split('v=')[1]?.split('&')[0]||l.split('youtu.be/')[1]?.split('?')[0]||l.split('embed/')[1]?.split('?')[0];if(id){filmes.push({t:n,i:`https://img.youtube.com/vi/${id}/hqdefault.jpg`,l:`https://www.youtube-nocookie.com/embed/${id}`,pasta:p,type:'yt'});fecharModal();render();}}
function deletar(i){if(confirm('Apagar?')){filmes.splice(i,1);render();}}
function editar(i){let n=prompt('Novo nome:',filmes[i].t);if(n){filmes[i].t=n;render();}}
function adicionarGenero(){let n=prompt('Nome da pasta?');if(n&&!generos.includes(n)){generos.push(n);render();atualizarSelect();}}
function exportarFixo(){alert('Já está fixo!');}
atualizarSelect();render();
