<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRATIFLIX TV - Filmes e Séries Grátis</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:'Segoe UI',Arial,sans-serif;overflow-x:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:15px 4%;background:linear-gradient(to bottom,#000,transparent);position:fixed;width:100%;z-index:100;transition:0.3s}
header.scrolled{background:#000}
.logo{color:#e50914;font-size:32px;font-weight:900;letter-spacing:1px}
.logo span{color:#fff}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.header-actions button{background:#e50914;color:#fff;border:none;padding:8px 16px;border-radius:4px;font-weight:700;cursor:pointer;font-size:13px}
.header-actions button:nth-child(2){background:#fff;color:#000}
.header-actions button:nth-child(3),.header-actions button:nth-child(4){background:rgba(109,109,110,0.7);color:#fff}
.banner{height:85vh;background:linear-gradient(to top,#0a0a0a 10%,transparent 60%),linear-gradient(to right,#0a0a0a 20%,transparent 70%),url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1920&q=80');background-size:cover;background-position:center;display:flex;align-items:end;padding:5% 4%}
.banner-info{max-width:600px}
.banner h1{font-size:56px;line-height:1;margin-bottom:10px;text-shadow:2px 2px 10px #000}
.banner p{font-size:18px;color:#ddd;margin:15px 0;line-height:1.4}
.btn-play{background:#fff;color:#000;padding:12px 32px;font-size:20px;font-weight:800;border:none;border-radius:4px;cursor:pointer;margin-right:10px}
.btn-lista{background:rgba(109,109,110,0.7);color:#fff;padding:12px 32px;font-size:18px;font-weight:600;border:none;border-radius:4px;cursor:pointer}
.tag-top10{background:#e50914;color:#fff;padding:4px 8px;font-weight:900;font-size:12px;border-radius:2px;display:inline-block;margin-bottom:10px}
section{padding:20px 4%}
.row-title{font-size:22px;margin:20px 0 10px;font-weight:700}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.card{min-width:180px;height:260px;border-radius:4px;overflow:hidden;position:relative;cursor:pointer;transition:transform 0.3s;background:#1a1a1a}
.card:hover{transform:scale(1.08);z-index:10}
.card img{width:100%;height:100%;object-fit:cover}
.card.info{position:absolute;bottom:0;background:linear-gradient(to top,#000,transparent);width:100%;padding:10px;font-size:13px}
#player{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:999;display:none;flex-direction:column}
#player iframe{width:100%;height:100%;border:none}
#player.close{position:absolute;top:20px;left:20px;background:#e50914;border:none;color:#fff;padding:10px 20px;border-radius:4px;cursor:pointer;z-index:1000}
@media(max-width:600px){.banner h1{font-size:32px}.card{min-width:130px;height:190px}header{flex-direction:column;gap:10px}}
</style>
</head>
<body>
<header id="header">
<div class="logo">GRATIFLIX <span>TV</span></div>
<div class="header-actions">
<button onclick="addPlaylist()">+ PLAYLIST</button>
<button onclick="abrirNoCelular()">📱 DO CELULAR</button>
<button onclick="backup()">💾 BACKUP</button>
<button onclick="restaurar()">♻️ RESTAURAR</button>
</div>
</header>

<div class="banner">
<div class="banner-info">
<div class="tag-top10">TOP 10 HOJE NO BRASIL</div>
<h1>Filmes, Séries e Canais Ao Vivo</h1>
<p>Assista tudo grátis sem cadastro. A melhor experiência tipo Netflix, direto no seu navegador e na sua TV.</p>
<button class="btn-play" onclick="play('https://www.youtube.com/embed/dQw4w9WgXcQ')">▶ Assistir</button>
<button class="btn-lista" onclick="addPlaylist()">+ Minha Lista</button>
</div>
</div>

<section>
<div class="row-title">🔥 Em Alta Agora</div>
<div class="row" id="row-alta"></div>

<div class="row-title">🎬 Filmes Adicionados</div>
<div class="row" id="row-filmes"></div>

<div class="row-title">📺 Minha Lista</div>
<div class="row" id="row-lista"><div style="color:#777;padding:20px">Sua lista está vazia. Clique em + PLAYLIST nos filmes</div></div>
</section>

<div id="player">
<button class="close" onclick="fechar()">✕ FECHAR</button>
<iframe id="frame" allowfullscreen></iframe>
</div>

<script>
const filmes = [
{title:"Ação Total", img:"https://images.unsplash.com/photo-1485846234645-a62644f84728?w=300", link:"https://www.youtube.com/embed/dQw4w9WgXcQ"},
{title:"Aventura 2024", img:"https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=300", link:"https://www.youtube.com/embed/dQw4w9WgXcQ"},
{title:"Comédia Top", img:"https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?w=300", link:"https://www.youtube.com/embed/dQw4w9WgXcQ"},
{title:"Drama Intenso", img:"https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=300", link:"https://www.youtube.com/embed/dQw4w9WgXcQ"},
{title:"Ficção Científica", img:"https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=300", link:"https://www.youtube.com/embed/dQw4w9WgXcQ"},
{title:"Terror Noite", img:"https://images.unsplash.com/photo-1509347528160-9a9e33742cdb?w=300", link:"https://www.youtube.com/embed/dQw4w9WgXcQ"},
];

function criarCard(f){
 return `<div class="card" onclick="play('${f.link}')"><img src="${f.img}"><div class="info">${f.title}</div></div>`;
}
document.getElementById('row-alta').innerHTML = filmes.map(criarCard).join('');
document.getElementById('row-filmes').innerHTML = [...filmes].reverse().map(criarCard).join('');

function play(link){
 document.getElementById('frame').src = link;
 document.getElementById('player').style.display='flex';
}
function fechar(){ document.getElementById('player').style.display='none'; document.getElementById('frame').src=''; }

function addPlaylist(){
 let lista = JSON.parse(localStorage.getItem('lista')||'[]');
 if(lista.length==0){ lista = filmes.slice(0,3); localStorage.setItem('lista', JSON.stringify(lista)); alert('3 filmes adicionados à sua lista!'); renderLista(); }
 else alert('Já tem filmes na lista!');
}
function renderLista(){
 let lista = JSON.parse(localStorage.getItem('lista')||'[]');
 if(lista.length>0) document.getElementById('row-lista').innerHTML = lista.map(criarCard).join('');
}
renderLista();

function backup(){
 const data = JSON.stringify(localStorage.getItem('lista')||'[]');
 const blob = new Blob([data],{type:'application/json'});
 const url = URL.createObjectURL(blob);
 const a = document.createElement('a'); a.href=url; a.download='gratiflix-backup.json'; a.click();
}
function restaurar(){
 const input = document.createElement('input'); input.type='file';
 input.onchange = e => {
   const file = e.target.files[0]; const r = new FileReader();
   r.onload = () => { localStorage.setItem('lista', r.result); renderLista(); alert('Restaurado!'); };
   r.readAsText(file);
 };
 input.click();
}
function abrirNoCelular(){
 alert('No celular, abra: gratiflix.bancogratidao.com.br e clique em Adicionar à tela inicial');
}
window.addEventListener('scroll',()=>{ document.getElementById('header').classList.toggle('scrolled', window.scrollY>50); });
</script>
</body>
</html>
