<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRATIFLIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#141414;color:#fff;font-family:Arial}
header{padding:12px 2%;background:#000;position:fixed;width:100%;top:0;z-index:100;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.logo{color:#e50914;font-size:26px;font-weight:900}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.actions button{border:none;padding:9px 10px;border-radius:4px;font-weight:800;cursor:pointer;font-size:9px}
.btn-green{background:#00c851;color:#fff}.btn-blue{background:#007feb;color:#fff}.btn-yellow{background:#ffcc00;color:#000}.btn-orange{background:#ff8c00;color:#000}
.search{margin-top:66px;padding:10px 2%;background:#0a0a0a;display:flex;gap:6px;position:fixed;width:100%;z-index:90}
.search input{flex:1;padding:12px;border-radius:4px;border:none;background:#222;color:#fff}
.row-title{font-size:17px;margin:24px 0 10px 2%;font-weight:800;border-left:4px solid #e50914;padding-left:8px}
.row{display:flex;gap:10px;overflow-x:auto;padding:0 2% 10px}
.card{min-width:145px;max-width:145px;height:210px;background:#222;border-radius:6px;overflow:hidden;position:relative}
.card img{width:100%;height:75%;object-fit:cover;cursor:pointer}
.card div{padding:6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edit-bar{position:absolute;top:0;left:0;background:rgba(0,0,0,.7);width:100%;padding:3px;display:flex;gap:4px}
#player{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none}#player iframe{width:100%;height:100%;border:none}
#modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:10000;display:none;align-items:center;justify-content:center;padding:12px}
.box{background:#181818;border-radius:10px;padding:16px;width:100%;max-width:520px;border:1px solid #333;max-height:90vh;overflow:auto}
.box h2{color:#e50914;margin-bottom:8px}.box label{font-size:11px;color:#ffcc00;font-weight:800;margin:6px 0 3px;display:block}
.box input,.box textarea,.box select{width:100%;padding:10px;border-radius:4px;border:none;background:#222;color:#fff;margin-bottom:6px} textarea{height:110px}
</style>
</head>
<body>

<div class="actions">

<button style="background:#333;color:#fff;border:none;padding:9px 10px;border-radius:4px;font-weight:800" onclick="localStorage.clear();location.reload()">↻ ATUALIZAR</button>
</div>
</header>
<div class="search"><input id="busca" placeholder="🔍 Buscar..." oninput="filtrar()"><button onclick="filtrar()" style="padding:12px 14px;border:none;background:#e50914;color:#fff;font-weight:900">🔍</button></div>
<div style="margin-top:115px;padding:20px 2%;background:linear-gradient(to top,#141414,transparent),url('https://images.unsplash.com/photo-1536440136628-849c177e76a1');background-size:cover"><h1><span style="color:#e50914">GRATI</span>FLIX</h1><p>72 filmes + opção Portal do Povo adicionada!</p></div>

{t:"Chaves 1",i:"https://img.youtube.com/vi/NdQn3sOGAB4/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/NdQn3sOGAB4",pasta:"Chaves"},
{t:"Chaves 2",i:"https://img.youtube.com/vi/4RNI-qPzMu4/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/4RNI-qPzMu4",pasta:"Chaves"},
{t:"Chaves 3",i:"https://img.youtube.com/vi/nON_DKL5asw/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/nON_DKL5asw",pasta:"Chaves"},
{t:"Chaves 4",i:"https://img.youtube.com/vi/oz4V7GNRpZ8/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/oz4V7GNRpZ8",pasta:"Chaves"},

{t:"Chaves 11",i:"https://img.youtube.com/vi/HvOfndzo97o/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/HvOfndzo97o",pasta:"Chaves"},
{t:"Chaves 12",i:"https://img.youtube.com/vi/mn2FRfmPRm8/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/mn2FRfmPRm8",pasta:"Chaves"},

{t:"Chaves 14",i:"https://img.youtube.com/vi/qCu3WKLOFhY/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/qCu3WKLOFhY",pasta:"Chaves"},
{t:"Chaves 15",i:"https://img.youtube.com/vi/Fm6Dm0uv7bU/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/Fm6Dm0uv7bU",pasta:"Chaves"},
{t:"Chaves 16",i:"https://img.youtube.com/vi/5Qc9sB1Nr5A/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/5Qc9sB1Nr5A",pasta:"Chaves"},
{t:"Chaves 17",i:"https://img.youtube.com/vi/1gDAclTluWQ/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/1gDAclTluWQ",pasta:"Chaves"},
{t:"Chaves 18",i:"https://img.youtube.com/vi/QbBFmlQfHmk/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/QbBFmlQfHmk",pasta:"Chaves"},
{t:"Chaves 19",i:"https://img.youtube.com/vi/TRu9a0uInEc/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/TRu9a0uInEc",pasta:"Chaves"},
{t:"Chaves 20",i:"https://img.youtube.com/vi/qodstxAiEs0/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/qodstxAiEs0",pasta:"Chaves"}
];
let extras=JSON.parse(localStorage.getItem('grati_extras')||'[]');
let filmes=[...filmesBase,...extras];
let generos=[...GENEROS_PADRAO];

function getID(url){
url=url.trim();
let id='';
if(url.includes('youtu.be/')) id=url.split('youtu.be/')[1];
else if(url.includes('v=')) id=url.split('v=')[1];
else if(url.includes('embed/')) id=url.split('embed/')[1];
else id=url;
id=id.split('?')[0].split('&')[0].split('/')[0].split(' ')[0];
if(id.includes('?is=')) id=id.split('?is=')[0];
return id.substring(0,11);
}
function render(){let c=document.getElementById('lista');c.innerHTML='';let todos=[...new Set([...GENEROS_PADRAO,...filmes.map(f=>f.pasta)])];todos.forEach(g=>{let lista=filmes.filter(f=>f.pasta===g);if(lista.length===0)return;let h=`<div class="row-title">${g} (${lista.length})</div><div class="row">`;lista.forEach(f=>{let idx=filmes.indexOf(f);let edit = extras.includes(f)? `<div class="edit-bar"><span onclick="editar(${idx})">✏️</span><span onclick="del(${idx})">🗑️</span></div>` : '';h+=`<div class="card">${edit}<img src="${f.i}" onerror="this.src='https://img.youtube.com/vi/${getID(f.l)}/hqdefault.jpg'" onclick="play(${idx})"><div>${f.t}</div></div>`});h+=`</div>`;c.innerHTML+=h;});}
function play(i){document.getElementById('player').style.display='block';document.getElementById('frame').src=filmes[i].l;}
function fechar(){document.getElementById('player').style.display='none';document.getElementById('frame').src='';}
function filtrar(){let q=document.getElementById('busca').value.toLowerCase();if(!q){render();return;}let f=filmes.filter(x=>x.t.toLowerCase().includes(q)||x.pasta.toLowerCase().includes(q));let c=document.getElementById('lista');let h=`<div class="row-title">Resultado (${f.length})</div><div class="row">`;f.forEach(fi=>{let idx=filmes.indexOf(fi);h+=`<div class="card"><img src="${fi.i}" onclick="play(${idx})"><div>${fi.t}</div></div>`});c.innerHTML=h+`</div>`;}
function abrirArquivo(){
document.getElementById('modal').style.display='flex';
document.getElementById('boxConteudo').innerHTML=`
<h2>📁 ARQUIVO / PASTA - Igual Portal do Povo</h2>
<p style="font-size:11px;color:#aaa">Arquivo no GitHub? Ex: looney-tunes/index.html</p>
<label>Nome da pasta no GitHub? (sem espaço, use traço)<br>Ex: looney-tunes</label>
<input id="pGit" placeholder="looney-tunes">
<label>Nome bonito pro site? Ex: Looney Tunes</label>
<input id="pBonito" placeholder="Looney Tunes">
<label>Cole os links (um por linha, pode ser com?is= que eu limpo):</label>
<textarea id="pLinks" placeholder="https://youtu.be/NdQn3sOGAB4?is=xxx\nhttps://youtu.be/..."></textarea>
<div style="display:flex;gap:6px;margin-top:10px">
<button style="flex:1;padding:12px;background:#333;color:#fff;border:none;border-radius:6px" onclick="fecharModal()">Cancelar</button>
<button style="flex:1;padding:12px;background:#ffcc00;color:#000;border:none;border-radius:6px;font-weight:900" onclick="gerar()">GERAR</button>
</div>
<div id="res" style="display:none;margin-top:12px"><label>Código pra colar no filmesBase:</label><textarea id="cod1" style="height:150px;background:#000;color:#0f0;font-size:10px"></textarea><button style="width:100%;padding:10px;background:#00c851;color:#fff;border:none;border-radius:6px;margin-top:6px" onclick="addTemp()">Adicionar agora (teste)</button></div>
`;
}
let temp=[];
function gerar(){
let pastaGit=document.getElementById('pGit').value.trim().toLowerCase().replace(/ /g,'-');
let bonito=document.getElementById('pBonito').value.trim()||pastaGit;
let linhas=document.getElementById('pLinks').value.trim().split('\n');
let cod='';temp=[];
linhas.forEach((ln,i)=>{
let id=getID(ln);if(id.length>=10){
let obj={t:`${bonito} ${i+1}`,i:`https://img.youtube.com/vi/${id}/hqdefault.jpg`,l:`https://www.youtube-nocookie.com/embed/${id}`,pasta:bonito};
temp.push(obj);
cod+=`{t:"${bonito} ${i+1}",i:"https://img.youtube.com/vi/${id}/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/${id}",pasta:"${bonito}"},\n`;
}
});
document.getElementById('cod1').value=cod;
document.getElementById('res').style.display='block';
if(!generos.includes(bonito)) generos.push(bonito);
}
function addTemp(){if(temp.length){extras=extras.concat(temp);localStorage.setItem('grati_extras',JSON.stringify(extras));filmes=filmes.concat(temp);render();fecharModal();alert(temp.length+' adicionados! Clique em SALVAR FIXO pra gerar código final pro GitHub');temp=[];}}
function fecharModal(){document.getElementById('modal').style.display='none';}
function addYT(){let link=prompt('Cole link YouTube:');if(!link)return;let id=getID(link);let nome=prompt('Nome:')||'Filme';let pasta=prompt('Pasta? Ex: Chaves')||'Geral';let obj={t:nome,i:`https://img.youtube.com/vi/${id}/hqdefault.jpg`,l:`https://www.youtube-nocookie.com/embed/${id}`,pasta:pasta};extras.push(obj);localStorage.setItem('grati_extras',JSON.stringify(extras));filmes.push(obj);if(!generos.includes(pasta))generos.push(pasta);render();}
function addPasta(){let n=prompt('Nome da pasta? Ex: Pica-Pau (pode ter espaço aqui, mas no GitHub use traço)');if(n&&!generos.includes(n)){generos.push(n);render();}}
function salvarFixo(){
let todos=[...filmesBase,...extras];
let txt='let filmesBase=[\n';
todos.forEach(f=>{txt+=`{t:"${f.t}",i:"${f.i}",l:"${f.l}",pasta:"${f.pasta}"},\n`;});
txt+='];';
document.getElementById('modal').style.display='flex';
document.getElementById('boxConteudo').innerHTML=`<h2>💾 SALVAR FIXO - Código final pro GitHub</h2><p style="font-size:11px;color:#aaa">Copie tudo e cole no seu index.html no GitHub, substituindo o filmesBase atual. Isso corrige as capas cinzas!</p><textarea style="height:300px;background:#000;color:#0f0;font-size:10px">${txt}</textarea><div style="display:flex;gap:6px;margin-top:8px"><button style="flex:1;padding:12px;background:#333;color:#fff;border:none;border-radius:6px" onclick="fecharModal()">Fechar</button><button style="flex:1;padding:12px;background:#e50914;color:#fff;border:none;border-radius:6px" onclick="navigator.clipboard.writeText(document.querySelector('textarea').value);alert('Copiado!')">Copiar</button></div>`;
}
function del(i){if(confirm('Apagar?')){let obj=filmes[i];let idx=extras.indexOf(obj);if(idx>-1){extras.splice(idx,1);localStorage.setItem('grati_extras',JSON.stringify(extras));}filmes.splice(i,1);render();}}
function editar(i){let n=prompt('Novo nome:',filmes[i].t);if(n)filmes[i].t=n;render();}
render();
</script>
</body>
</html>
