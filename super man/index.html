<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Man - GRATIFLIX</title>
<style>body{background:#141414;color:#fff;font-family:Arial;margin:0}header{padding:15px;background:#000;display:flex;justify-content:space-between;align-items:center} .logo{color:#e50914;font-size:28px;font-weight:900} .row-title{margin:20px 4%;border-left:4px solid #e50914;padding-left:8px;font-weight:800;font-size:18px} .row{display:flex;flex-wrap:wrap;gap:12px;padding:0 4%} .card{width:150px;background:#222;border-radius:6px;overflow:hidden} .card img{width:100%;height:190px;object-fit:cover;cursor:pointer} .card div{padding:6px;font-size:11px} #player{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none} #player iframe{width:100%;height:100%;border:none} .voltar{position:absolute;top:15px;left:15px;background:#e50914;color:#fff;border:none;padding:10px 15px;border-radius:5px;z-index:10000}</style>
</head>
<body>
<header><div class="logo">GRATIFLIX - Super Man</div><button onclick="history.back()" style="background:#e50914;color:#fff;border:none;padding:8px 12px;border-radius:4px;font-weight:800">VOLTAR</button></header>
<div class="row-title">Super Man (17)</div><div class="row" id="lista"></div>
<div id="player"><button class="voltar" onclick="document.getElementById('player').style.display='none';document.getElementById('frame').src=''">↩ VOLTAR</button><iframe id="frame" allowfullscreen></iframe></div>
<script>
let filmes=[
{t:"Super Man 1",i:"https://img.youtube.com/vi/plaU0sa1MQ8/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/plaU0sa1MQ8"},
{t:"Super Man 2",i:"https://img.youtube.com/vi/Rw3Tv8WAd1w/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/Rw3Tv8WAd1w"},
{t:"Super Man 3",i:"https://img.youtube.com/vi/g-Nyi9dOy6E/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/g-Nyi9dOy6E"},
{t:"Super Man 4",i:"https://img.youtube.com/vi/nul6lTbu3oA/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/nul6lTbu3oA"},
{t:"Super Man 5",i:"https://img.youtube.com/vi/6lcoN1wEwfY/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/6lcoN1wEwfY"},
{t:"Super Man 6",i:"https://img.youtube.com/vi/t0EDs_Em5SA/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/t0EDs_Em5SA"},
{t:"Super Man 7",i:"https://img.youtube.com/vi/Okdz0F_yvOs/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/Okdz0F_yvOs"},
{t:"Super Man 8",i:"https://img.youtube.com/vi/6c6JRnISSwk/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/6c6JRnISSwk"},
{t:"Super Man 9",i:"https://img.youtube.com/vi/9FiJP1GFI5k/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/9FiJP1GFI5k"},
{t:"Super Man 10",i:"https://img.youtube.com/vi/dwNV3NHOigE/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/dwNV3NHOigE"},
{t:"Super Man 11",i:"https://img.youtube.com/vi/uyJPOwB6NcE/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/uyJPOwB6NcE"},
{t:"Super Man 12",i:"https://img.youtube.com/vi/6xCyxJusNPs/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/6xCyxJusNPs"},
{t:"Super Man 13",i:"https://img.youtube.com/vi/iza00gea8oI/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/iza00gea8oI"},
{t:"Super Man 14",i:"https://img.youtube.com/vi/ks_-OO4liW0/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/ks_-OO4liW0"},
{t:"Super Man 15",i:"https://img.youtube.com/vi/bksyv1D6xLc/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/bksyv1D6xLc"},
{t:"Super Man 16",i:"https://img.youtube.com/vi/YU21uP7TDYU/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/YU21uP7TDYU"},
{t:"Super Man 17",i:"https://img.youtube.com/vi/CBpL31uUye4/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/CBpL31uUye4"}
];
let h='';filmes.forEach(f=>{h+=`<div class="card"><img src="${f.i}" onclick="document.getElementById('player').style.display='block';document.getElementById('frame').src='${f.l}'"><div>${f.t}</div></div>`});document.getElementById('lista').innerHTML=h;
</script>
</body>
</html>
